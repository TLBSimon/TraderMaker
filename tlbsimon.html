/* ===== TLBSimon — dokončenie: animácie / prechody / plynulosť (bez redizajnu) ===== */
/* Všetko len transform + opacity (+ blur len pri prechode stránky). Žiadne top/left/width/height v animáciách. */
html{scroll-behavior:smooth}
body{overflow-x:hidden}
#root{overflow-x:clip;transition:opacity .35s ease,transform .35s ease,filter .35s ease;will-change:opacity,transform,filter}
#root.tm-page-out{opacity:0 !important;transform:translateY(-8px);filter:blur(2px);transition-duration:.25s;transition-delay:0s}
#root.tm-page-in{opacity:0;transform:translateY(8px);filter:blur(2px);transition-duration:.35s;transition-delay:.05s}
#root.tm-page-in.tm-page-in-done{opacity:1;transform:translateY(0);filter:blur(0)}
#tm-progress{position:fixed;top:0;left:0;height:2px;width:100%;background:#D4AF37;transform:scaleX(0);transform-origin:0 50%;z-index:60;pointer-events:none;will-change:transform}
/* Scroll reveal — počiatočný stav nastavuje až JS (html.tm-js), bez JS ostáva všetko viditeľné */
html.tm-js .tm-reveal{opacity:0;transform:translateY(12px);transition:opacity .55s ease,transform .55s ease;will-change:opacity,transform}
html.tm-js .tm-reveal.tm-visible{opacity:1;transform:translateY(0)}
/* 1) MALÁ — Hero: takmer nepostrehnuteľný, pokojný dych portrétu */
img[alt="Šimon Čierťaský - trading"]{animation:tm-hero 24s ease-in-out infinite alternate;will-change:transform}
@keyframes tm-hero{from{transform:scale(1)}to{transform:scale(1.035)}}
/* 2) HLAVNÁ — Eufória vs. Séria (karta EGO 10 → 240 → 0) */
.tm-euforia{margin:0 0 16px;padding:0}
.tm-euforia svg{display:block;width:100%;height:auto;overflow:visible}
.tm-euforia .tm-baseline{stroke:rgba(255,255,255,.10);stroke-width:1}
.tm-euforia .tm-spike,.tm-euforia .tm-seria{stroke-dasharray:var(--tm-len,400);stroke-dashoffset:var(--tm-len,400);transition:stroke-dashoffset 2.2s cubic-bezier(.4,0,.2,1),opacity .6s ease}
.tm-euforia.tm-play .tm-spike{stroke-dashoffset:0;transition-delay:.1s}
.tm-euforia.tm-play .tm-seria{stroke-dashoffset:0;transition-delay:1s;transition-duration:1.8s}
.tm-euforia .tm-dot-peak,.tm-euforia .tm-dot-seria{opacity:0;transition:opacity .6s ease}
.tm-euforia.tm-play .tm-dot-peak{opacity:1;transition-delay:1.6s}
.tm-euforia.tm-play .tm-dot-seria{opacity:1;transition-delay:2.2s}
.tm-svg-label{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.12em}
.tm-svg-label-red{fill:rgba(239,68,68,.9)}
.tm-svg-label-gold{fill:rgba(212,175,55,.9)}
/* 3) MALÁ — Pattern: strach → pomsta → ego → ticho (karta BREAKTHROUGH) */
.tm-pattern{position:relative;margin:18px 0 2px;padding:6px 2px 0;height:46px}
.tm-pattern-track{position:absolute;left:6px;right:6px;top:12px;height:1px;background:rgba(255,255,255,.12)}
.tm-pattern-fill{height:100%;width:100%;background:rgba(212,175,55,.55);transform:scaleX(0);transform-origin:0 50%;transition:transform 1.8s cubic-bezier(.4,0,.2,1) .2s}
.tm-pattern-dots{position:relative;display:flex;justify-content:space-between}
.tm-pattern-dots .tm-dot{width:7px;height:7px;border-radius:9999px;background:#D4AF37;opacity:.3;transform:scale(.8);transition:opacity .5s ease,transform .5s ease}
.tm-pattern.tm-play .tm-pattern-fill{transform:scaleX(1)}
.tm-pattern.tm-play .tm-dot:nth-child(1){opacity:1;transform:scale(1);transition-delay:.3s}
.tm-pattern.tm-play .tm-dot:nth-child(2){opacity:1;transform:scale(1);transition-delay:.7s}
.tm-pattern.tm-play .tm-dot:nth-child(3){opacity:1;transform:scale(1);transition-delay:1.1s}
.tm-pattern.tm-play .tm-dot:nth-child(4){opacity:1;transform:scale(1);transition-delay:1.5s}
.tm-pattern-labels{display:flex;justify-content:space-between;margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;color:rgba(255,255,255,.35)}
/* 4) MALÁ — Dohoda + pravidlá: jemný stagger, nie blikanie */
.tm-deal-tag,.tm-rule{opacity:0;transform:translateY(4px);transition:opacity .5s ease,transform .5s ease}
.tm-visible .tm-deal-tag,.tm-visible .tm-rule{opacity:1;transform:translateY(0)}
.tm-visible .tm-deal-tag:nth-child(1){transition-delay:.15s}
.tm-visible .tm-deal-tag:nth-child(2){transition-delay:.3s}
.tm-visible .tm-deal-tag:nth-child(3){transition-delay:.45s}
/* Hover je len jemný zdvih cez transform, nie zmena layoutu */
#root a{transition:color .25s ease,background-color .25s ease,opacity .25s ease}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  html.tm-js .tm-reveal{opacity:1 !important;transform:none !important}
  .tm-euforia .tm-spike,.tm-euforia .tm-seria{stroke-dashoffset:0 !important}
  .tm-euforia .tm-dot-peak,.tm-euforia .tm-dot-seria,.tm-pattern-dots .tm-dot,.tm-deal-tag,.tm-rule{opacity:1 !important;transform:none !important}
  .tm-pattern-fill{transform:scaleX(1) !important}
}

  </style>
  <script>
/* ===== TLBSimon — jeden router, scroll reveal, progress, animácie ako lekcia ===== */
(function(){
  'use strict';
  var root = document.getElementById('root');
  if(!root) return;
  document.documentElement.classList.add('tm-js');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isTransitioning = false, outTimer = null, inTimer = null, cleanTimer = null, safetyTimer = null;

  function forceClean(){
    if(outTimer) clearTimeout(outTimer);
    if(inTimer) clearTimeout(inTimer);
    if(cleanTimer) clearTimeout(cleanTimer);
    if(safetyTimer) clearTimeout(safetyTimer);
    outTimer = inTimer = cleanTimer = safetyTimer = null;
    root.classList.remove('tm-page-out','tm-page-in','tm-page-in-done');
    root.style.opacity = ''; root.style.transform = ''; root.style.filter = '';
    document.body.style.overflow = '';
    isTransitioning = false;
  }
  function safety(){ if(safetyTimer) clearTimeout(safetyTimer); safetyTimer = setTimeout(forceClean, 900); }
  function scrollToAnchor(anchor){
    if(!anchor){ window.scrollTo({top:0, behavior: reduced ? 'auto' : 'smooth'}); return; }
    var el = document.getElementById(anchor);
    if(el) el.scrollIntoView({behavior: reduced ? 'auto' : 'smooth', block:'start'});
  }
  function isValidAnchor(a){ return a === '' || a === 'story' || a === 'contact'; }

  /* JEDEN router: jeden pushState na klik, popstate bez ďalšieho pushState, fallback Domov */
  function navigate(anchor, push){
    anchor = isValidAnchor(anchor) ? anchor : '';
    if(isTransitioning) forceClean(); /* rýchle Späť dvakrát: dokonči predchádzajúci prechod, začni nový */
    /* pushState HNEĎ na klik — jeden na klik, aby Späť fungovalo aj počas 250 ms prechodu */
    if(push){ try{ history.pushState({anchor:anchor}, '', anchor ? '#'+anchor : location.pathname); }catch(e){} }
    if(reduced){
      scrollToAnchor(anchor); return;
    }
    isTransitioning = true;
    root.classList.remove('tm-page-in','tm-page-in-done');
    root.classList.add('tm-page-out');
    safety();
    outTimer = setTimeout(function(){
      scrollToAnchor(anchor);
      root.classList.remove('tm-page-out');
      root.classList.add('tm-page-in');
      void root.offsetHeight;
      inTimer = setTimeout(function(){
        root.classList.add('tm-page-in-done');
        cleanTimer = setTimeout(forceClean, 420);
      }, 60);
    }, 250);
  }

  window.addEventListener('popstate', function(e){
    var anchor = '';
    if(e.state && typeof e.state.anchor === 'string') anchor = e.state.anchor;
    else { /* state null → fallback na Domov, resp. na hash ak je platný */
      var h = location.hash ? location.hash.replace('#','') : '';
      anchor = isValidAnchor(h) ? h : '';
    }
    navigate(anchor, false);
  });
  window.addEventListener('pageshow', function(){ setTimeout(forceClean, 50); });
  /* Poistka: nikdy nenechaj čiernu prázdnu plochu */
  setTimeout(forceClean, 1500);

  document.addEventListener('click', function(ev){
    var a = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
    if(!a) return;
    if(a.getAttribute('target')) a.removeAttribute('target'); /* všetky prekliky v tej istej tabe */
    var href = a.getAttribute('href') || '';
    if(href.charAt(0) === '#'){
      var anchor = href.slice(1);
      if(isValidAnchor(anchor)){ ev.preventDefault(); navigate(anchor, true); }
    }
  }, false);

  function stripTargets(){
    root.querySelectorAll('a[target]').forEach(function(l){ l.removeAttribute('target'); });
  }
  function findArticle(fragment){
    var arts = root.querySelectorAll('article');
    for(var i=0;i<arts.length;i++){ if(arts[i].textContent.indexOf(fragment) !== -1) return arts[i]; }
    return null;
  }

  /* HLAVNÁ animácia — Eufória vs. Séria, vložená do existujúcej karty EGO, pred existujúce pravidlá */
  function injectEuforia(){
    if(document.querySelector('.tm-euforia')) return;
    var art = findArticle('Koľko je dosť');
    if(!art) return;
    var rulesBox = null;
    art.querySelectorAll('div').forEach(function(d){ if(d.textContent.indexOf('VŽDY SL') !== -1) rulesBox = d; });
    if(!rulesBox) return;
    var fig = document.createElement('figure');
    fig.className = 'tm-euforia';
    fig.setAttribute('aria-label', 'Eufória: 10 eur na 240 eur a večer späť na nulu. Séria: pokojné, rovnomerné kroky.');
    fig.innerHTML =
      '<svg viewBox="0 0 320 96" role="img" aria-hidden="true" focusable="false">' +
      '<line class="tm-baseline" x1="8" y1="78" x2="312" y2="78"/>' +
      '<path class="tm-spike" d="M10 70 L72 64 L138 16 L198 68 L268 72 L306 73" fill="none" stroke="#EF4444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path class="tm-seria" d="M10 74 L62 70 L114 66 L166 61 L218 57 L268 53 L306 50" fill="none" stroke="#D4AF37" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle class="tm-dot-peak" cx="138" cy="16" r="3" fill="#EF4444"/>' +
      '<circle class="tm-dot-seria" cx="306" cy="50" r="3" fill="#D4AF37"/>' +
      '<text class="tm-svg-label tm-svg-label-red" x="148" y="12">10 → 240 → 0</text>' +
      '<text class="tm-svg-label tm-svg-label-gold" x="250" y="42">SÉRIA</text>' +
      '</svg>';
    rulesBox.parentNode.insertBefore(fig, rulesBox);
    /* dĺžka čiar pre presné kreslenie, bez hádania */
    fig.querySelectorAll('path').forEach(function(p){
      try{ var len = p.getTotalLength(); p.style.setProperty('--tm-len', len); }catch(e){}
    });
    observePlay(fig, 'tm-play');
    /* pravidlá v tej istej karte: stagger */
    rulesBox.querySelectorAll('span').forEach(function(s, i){ s.classList.add('tm-rule'); s.style.transitionDelay = (0.2 + i * 0.12) + 's'; });
  }

  /* MALÁ animácia — Pattern strach → pomsta → ego → ticho */
  function injectPattern(){
    if(document.querySelector('.tm-pattern')) return;
    var art = findArticle('50+ účtov');
    if(!art) return;
    var p = art.querySelector('p');
    if(!p) return;
    var box = document.createElement('div');
    box.className = 'tm-pattern';
    box.setAttribute('role', 'img');
    box.setAttribute('aria-label', 'Pattern: strach, pomsta, ego, ticho.');
    box.innerHTML =
      '<div class="tm-pattern-track"><div class="tm-pattern-fill"></div></div>' +
      '<div class="tm-pattern-dots"><span class="tm-dot"></span><span class="tm-dot"></span><span class="tm-dot"></span><span class="tm-dot"></span></div>' +
      '<div class="tm-pattern-labels"><span>STRACH</span><span>POMSTA</span><span>EGO</span><span>TICHO</span></div>';
    p.parentNode.insertBefore(box, p.nextSibling);
    observePlay(box, 'tm-play');
  }

  function observePlay(el, cls){
    if(!('IntersectionObserver' in window)){ el.classList.add(cls); return; }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if(en.isIntersecting){ el.classList.add(cls); io.disconnect(); } });
    }, {threshold: 0.35});
    io.observe(el);
  }

  function initReveal(){
    var groups = [];
    var header = root.querySelector('header'); if(header) groups.push([header]);
    var hero = root.querySelector('section'); if(hero) groups.push([hero]);
    var arts = Array.prototype.slice.call(root.querySelectorAll('#story article'));
    if(arts.length) groups.push(arts);
    root.querySelectorAll('.grid').forEach(function(g){
      var cards = Array.prototype.slice.call(g.children);
      if(cards.length) groups.push(cards);
    });
    /* Dohoda — zelený box */
    var dealBox = null;
    root.querySelectorAll('div').forEach(function(d){ if(d.textContent.indexOf('Dohoda, nie služba.') !== -1 && d.className.indexOf('0F2A1F') !== -1) dealBox = d; });
    if(dealBox){
      groups.push([dealBox]);
      dealBox.querySelectorAll('span').forEach(function(s){
        if(s.textContent.indexOf('ONE ON ONE') !== -1 || s.textContent.indexOf('WIN-WIN') !== -1 || s.textContent.indexOf('OR NOTHING') !== -1) s.classList.add('tm-deal-tag');
      });
    }
    var contactBox = document.querySelector('#contact > div'); if(contactBox) groups.push([contactBox]);
    var footer = root.querySelector('footer'); if(footer) groups.push([footer]);

    var all = [];
    groups.forEach(function(group){
      group.forEach(function(el, i){
        if(el.classList.contains('tm-reveal')) return;
        el.classList.add('tm-reveal');
        el.style.transitionDelay = (i * 40) + 'ms'; /* stagger 40 ms medzi kartami */
        all.push(el);
      });
    });
    if(!('IntersectionObserver' in window)){ all.forEach(function(el){ el.classList.add('tm-visible'); }); return; }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('tm-visible'); io.unobserve(en.target); } });
    }, {threshold: 0.1, rootMargin: '0px 0px -6% 0px'});
    all.forEach(function(el){ io.observe(el); });
  }

  function initProgress(){
    var bar = document.getElementById('tm-progress');
    if(!bar) return;
    var ticking = false;
    function update(){
      ticking = false;
      var max = document.documentElement.scrollHeight - window.innerHeight;
      var p = max > 0 ? (window.scrollY / max) : 0;
      if(p < 0) p = 0; if(p > 1) p = 1;
      bar.style.transform = 'scaleX(' + p.toFixed(4) + ')';
    }
    window.addEventListener('scroll', function(){ if(!ticking){ ticking = true; requestAnimationFrame(update); } }, {passive:true});
    window.addEventListener('resize', update);
    update();
  }

  var tries = 0;
  function init(){
    tries++;
    if((!document.getElementById('story') || !document.getElementById('contact')) && tries < 60){ setTimeout(init, 100); return; }
    stripTargets(); injectEuforia(); injectPattern(); initReveal(); initProgress();
    var mo = new MutationObserver(function(){
      if(!document.querySelector('.tm-euforia')) injectEuforia();
      if(!document.querySelector('.tm-pattern')) injectPattern();
      stripTargets();
    });
    mo.observe(root, {childList:true, subtree:true});
    try{
      var initAnchor = location.hash ? location.hash.replace('#','') : '';
      if(!isValidAnchor(initAnchor)) initAnchor = '';
      history.replaceState({anchor:initAnchor}, '', initAnchor ? '#'+initAnchor : location.pathname);
      if(initAnchor) setTimeout(function(){ scrollToAnchor(initAnchor); }, 80);
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

  </script>
