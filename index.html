:root{
  --surface:#0d1310;
  --surface-2:#142019;
  --ink:#f4f0e4;
  --muted:#aab8ae;
  --line:#2a3a30;
  --accent:#7ec9a4;
  --gold:#e2bd55;
  --paper:#18241e;
}

@media (prefers-color-scheme: light){
  :root{
    --surface:#f7f3ea;
    --surface-2:#fffdf7;
    --ink:#17201c;
    --muted:#66706a;
    --line:#ddd5c3;
    --accent:#1d5c44;
    --gold:#c69a2e;
    --paper:#fffaf0;
  }
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:'Manrope',system-ui,sans-serif;
  background:var(--surface);
  color:var(--ink);
}

.font-display{
  font-family:'Fraunces',Georgia,serif;
}

a{
  color:inherit;
}

button{
  font-family:inherit;
}

.wrap{
  width:min(1180px,100%);
  margin-inline:auto;
  padding-inline:20px;
}

.eyebrow{
  letter-spacing:.18em;
  text-transform:uppercase;
  font-size:11px;
  font-weight:800;
}

.card{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:22px;
}

.chip{
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 11px;
  font-size:12px;
  font-weight:700;
}

.input{
  width:100%;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink);
  border-radius:12px;
  padding:12px 13px;
  font-size:15px;
}

.input:focus{
  outline:2px solid var(--gold);
  outline-offset:2px;
}

.btn{
  border:0;
  border-radius:999px;
  padding:12px 18px;
  font-weight:800;
  cursor:pointer;
  transition:transform .35s ease, background-color .35s ease, color .35s ease, box-shadow .35s ease, border-color .35s ease;
}

.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 24px rgba(0,0,0,.22);
}

.btn:active{
  transform:translateY(0);
}

.btn:disabled{
  opacity:.55;
  cursor:wait;
}

.blueprint{
  background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:28px 28px;
}

.waves{
  background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.18) 0 2px,transparent 3px),radial-gradient(circle at 70% 40%,rgba(255,255,255,.14) 0 1px,transparent 2px);
  background-size:90px 70px,130px 90px;
}

.no-scrollbar::-webkit-scrollbar{
  display:none;
}

.stars{
  background-image:radial-gradient(circle at 15% 20%,rgba(255,255,255,.22) 0 1px,transparent 2px),radial-gradient(circle at 70% 30%,rgba(255,255,255,.18) 0 1px,transparent 2px),radial-gradient(circle at 40% 70%,rgba(158,216,255,.25) 0 1px,transparent 2px),radial-gradient(circle at 85% 75%,rgba(255,255,255,.15) 0 1px,transparent 2px);
  background-size:140px 140px,190px 160px,230px 200px,170px 180px;
}

@keyframes breathe{
  0%,100%{
    background-color:#0d1310;
  }

  50%{
    background-color:#111c16;
  }
}

@keyframes logoGlow{
  0%,100%{
    filter:drop-shadow(0 0 2px rgba(226,189,85,.35));
  }

  50%{
    filter:drop-shadow(0 0 7px rgba(226,189,85,.75));
  }
}

@keyframes candleRise{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-.6px);
  }
}

.breathing-bg{
  animation:breathe 9s ease-in-out infinite;
}

.logo-mark{
  overflow:visible;
}

.logo-star{
  transform-origin:22px 11px;
  animation:logoGlow 4.5s ease-in-out infinite, candleRise 4.5s ease-in-out infinite;
}

.reveal{
  opacity:0;
  transform:translateY(14px);
  transition:opacity .7s ease, transform .7s ease;
}

.reveal.is-visible{
  opacity:1;
  transform:translateY(0);
}

.hover-card{
  transition:transform .4s ease, border-color .4s ease, box-shadow .4s ease;
}

.hover-card:hover{
  transform:translateY(-4px);
  border-color:rgba(226,189,85,.65) !important;
  box-shadow:0 18px 34px rgba(0,0,0,.28);
}

section{
  animation:sectionIn .6s ease both;
}

@keyframes sectionIn{
  from{
    opacity:.92;
  }

  to{
    opacity:1;
  }
}

@media (prefers-reduced-motion: reduce){
  .breathing-bg,.logo-star,.reveal{
    animation:none !important;
    transition:none !important;
  }

  .reveal{
    opacity:1;
    transform:none;
  }

  html{
    scroll-behavior:auto;
  }
}

.hover\:bg-\[var\(--surface-2\)\]:hover{
  background-color: var(--surface-2);
}

@media (min-width: 640px){
  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:items-center{
    align-items: center;
  }

  .sm\:justify-between{
    justify-content: space-between;
  }

  .sm\:gap-2{
    gap: 0.5rem;
  }

  .sm\:gap-3{
    gap: 0.75rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:p-8{
    padding: 2rem;
  }

  .sm\:py-16{
    padding-top: 4rem;
    padding-bottom: 4rem;
  }

  .sm\:py-20{
    padding-top: 5rem;
    padding-bottom: 5rem;
  }

  .sm\:text-4xl{
    font-size: 2.25rem;
    line-height: 2.5rem;
  }
}

@media (min-width: 768px){
  .md\:block{
    display: block;
  }

  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px){
  .lg\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.15fr_\.85fr\]{
    grid-template-columns: 1.15fr .85fr;
  }

  .lg\:grid-cols-\[1fr_1\.15fr\]{
    grid-template-columns: 1fr 1.15fr;
  }

  .lg\:items-center{
    align-items: center;
  }
}

@media (min-width: 1280px){
  .xl\:flex{
    display: flex;
  }

  .xl\:hidden{
    display: none;
  }

  .xl\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
