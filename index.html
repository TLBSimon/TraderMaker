*{

html{
  scroll-behavior:smooth;

body{
  margin:0;
  font-family:'Manrope',system-ui,sans-serif;

}

.wrap{
  width:min(1180px,100%);

  padding-inline:20px;
}

.eyebrow{
  letter-spacing:.18em;
  text-transform:uppercase;
  font-size:11px;
  font-weight:800;
}

.card{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:22px;
}

.chip{
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 11px;
  font-size:12px;
  font-weight:700;
}

.input{
  width:100%;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink);
  border-radius:12px;
  padding:12px 13px;
  font-size:15px;
}

.input:focus{
  outline:2px solid var(--gold);
  outline-offset:2px;
}

.btn{
  border:0;
  border-radius:999px;
  padding:12px 18px;
  font-weight:800;
  cursor:pointer;
  transition:transform .35s cubic-bezier(.22,.61,.36,1), background-color .35s ease, color .35s ease, box-shadow .35s ease, border-color .35s ease;
}

.btn:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 24px rgba(0,0,0,.22), 0 0 0 1px rgba(226,189,85,.35), 0 0 22px rgba(226,189,85,.28);
  will-change:transform;
}

.btn:focus-visible{
  box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--gold);
}

.btn:active{
  transform:translateY(0);
}

.btn:disabled{
  opacity:.55;
  cursor:wait;
}

.blueprint{
  background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:28px 28px;
}

.waves{
  background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.18) 0 2px,transparent 3px),radial-gradient(circle at 70% 40%,rgba(255,255,255,.14) 0 1px,transparent 2px);
  background-size:90px 70px,130px 90px;
}

.no-scrollbar::-webkit-scrollbar{
  display:none;
}

.stars{
  background-image:radial-gradient(circle at 15% 20%,rgba(255,255,255,.22) 0 1px,transparent 2px),radial-gradient(circle at 70% 30%,rgba(255,255,255,.18) 0 1px,transparent 2px),radial-gradient(circle at 40% 70%,rgba(158,216,255,.25) 0 1px,transparent 2px),radial-gradient(circle at 85% 75%,rgba(255,255,255,.15) 0 1px,transparent 2px);
  background-size:140px 140px,190px 160px,230px 200px,170px 180px;
}

@keyframes breathe{
  0%,100%{
    opacity:.35;
    transform:scale(1);
  }

  50%{
    opacity:.75;
    transform:scale(1.04);
  }
}

@keyframes logoGlow{
  0%,100%{
    opacity:.75;
    transform:scale(1);
  }

  50%{
    opacity:1;
    transform:scale(1.12);
  }
}

@keyframes candleRise{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-.6px);
  }
}

.breathing-bg{
  position:relative;
  isolation:isolate;
}

.breathing-bg::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:radial-gradient(720px 420px at 78% 8%, rgba(226,189,85,.16), transparent 62%), radial-gradient(560px 360px at 12% 88%, rgba(126,201,164,.10), transparent 60%);
  animation:breathe 9s ease-in-out infinite;
  will-change:opacity,transform;
}

.breathing-bg > *{
  position:relative;
  z-index:1;
}

.parallax-layer{
  position:absolute;
  inset:-8% 0;
  z-index:0;
  pointer-events:none;
  background:radial-gradient(520px 320px at 22% 18%, rgba(226,189,85,.10), transparent 62%), radial-gradient(420px 280px at 88% 72%, rgba(255,255,255,.05), transparent 60%);
  will-change:transform;
}

.logo-mark{
  overflow:visible;
}

.logo-star{
  transform-origin:22px 11px;
  animation:logoGlow 4.5s ease-in-out infinite;
}

.logo-glow{
  animation:logoGlow 4.5s ease-in-out infinite;
  transform-origin:center;
}

@keyframes heroFade{
  from{
    opacity:0;
    transform:translateY(14px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.hero-fade{
  animation:heroFade .6s cubic-bezier(.22,.61,.36,1) both;
}

.hero-fade-delay{
  animation-delay:.08s;
}

.hero-fade-delay-2{
  animation-delay:.16s;
}

.reveal{
  opacity:0;
  transform:translateY(10px);
  transition:opacity .6s cubic-bezier(.22,.61,.36,1), transform .6s cubic-bezier(.22,.61,.36,1);
}

.reveal.is-visible{
  opacity:1;
  transform:translateY(0);
  will-change:auto;
}

.reveal:not(.is-visible){
  will-change:opacity,transform;
}

.page-transition{
  opacity:1;
  visibility:visible;
  transform:none;
  pointer-events:auto;
}

.page-transition-out,.page-transition-out-reverse{
  opacity:1;
  visibility:visible;
  transform:none;
  filter:none;
}

.page-transition-in,.page-transition-in-reverse{
  opacity:1;
  visibility:visible;
  transform:none;
  filter:none;
}

/* Bezpečný fade-in: beží až PO zobrazení stránky (display:block).
   Ak sa animácia zasekne, stránka aj tak ostane viditeľná, lebo základ je opacity:1. */

[data-page]{
  opacity:1;
  visibility:visible;
  animation:pageIn 300ms ease-out both;
}

main[data-direction="back"] [data-page]{
  animation-name:pageInReverse;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(8px);
    filter:blur(2px);
  }

  to{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
  }
}

@keyframes pageInReverse{
  from{
    opacity:0;
    transform:translateY(-8px);
    filter:blur(2px);
  }

  to{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
  }
}

.route-card{
  animation:cardIn 350ms ease-out both;
  will-change:transform,opacity;
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.scroll-progress-track{
  height:2px;
  background:rgba(255,255,255,.12);
  overflow:hidden;
}

.scroll-progress-fill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#b98a1f,#e2bd55,#f7d774);
  transform-origin:left center;
  will-change:transform;
}

@keyframes scrollPulse{
  0%,100%{
    transform:translateY(0);
    opacity:.85;
  }

  50%{
    transform:translateY(6px);
    opacity:1;
  }
}

.scroll-indicator{
  animation:scrollPulse 2.2s ease-in-out infinite;
}

.scroll-indicator-ring{
  animation:scrollPulse 2.2s ease-in-out infinite;
}

.hover-card{
  transition:transform .38s cubic-bezier(.22,.61,.36,1), border-color .38s ease, box-shadow .38s ease;
}

.hover-card:hover{
  transform:translateY(-4px);
  border-color:rgba(226,189,85,.65) !important;
  box-shadow:0 18px 34px rgba(0,0,0,.28);
  will-change:transform;
}

@media (prefers-reduced-motion: reduce){
  .breathing-bg::before,.logo-star,.logo-glow,.reveal,.scroll-indicator,.scroll-indicator-ring,.page-transition-in,.page-transition-in-reverse,.route-card,.hero-fade,.parallax-layer{
    animation:none !important;
    transition:none !important;
  }

  .reveal,.route-card{
    opacity:1;
    transform:none;
    filter:none;
  }

  .page-transition-out,.page-transition-out-reverse{
    filter:none;
  }

  html{
    scroll-behavior:auto;
  }
}

.hover\:bg-\[var\(--surface-2\)\]:hover{
  background-color: var(--surface-2);
}

.hover\:text-white:hover{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

  .sm\:items-center{
    align-items: center;
  }

  .sm\:justify-between{
