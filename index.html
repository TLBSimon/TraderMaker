.btn:active{

@keyframes breathe{
  0%,100%{
    opacity:.35;
    transform:scale(1);
  }

  50%{
    opacity:.75;
    transform:scale(1.04);
  }
}

@keyframes logoGlow{
  0%,100%{
    opacity:.75;
    transform:scale(1);
  }

  50%{
    opacity:1;
    transform:scale(1.12);
  }
}

@keyframes candleRise{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-.6px);
  }
}

.breathing-bg{
  position:relative;
  isolation:isolate;
}

.breathing-bg::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:radial-gradient(720px 420px at 78% 8%, rgba(226,189,85,.16), transparent 62%), radial-gradient(560px 360px at 12% 88%, rgba(126,201,164,.10), transparent 60%);
  animation:breathe 9s ease-in-out infinite;
  will-change:opacity,transform;
}

.breathing-bg > *{
  position:relative;
  z-index:1;
}

.parallax-layer{
  position:absolute;
  inset:-8% 0;
  z-index:0;
  pointer-events:none;
  background:radial-gradient(520px 320px at 22% 18%, rgba(226,189,85,.10), transparent 62%), radial-gradient(420px 280px at 88% 72%, rgba(255,255,255,.05), transparent 60%);
  will-change:transform;
}

.logo-mark{
  overflow:visible;
}

.logo-star{
  transform-origin:22px 11px;
  animation:logoGlow 4.5s ease-in-out infinite;
}

.logo-glow{
  animation:logoGlow 4.5s ease-in-out infinite;
  transform-origin:center;
}

@keyframes heroFade{
  from{
    opacity:0;
    transform:translateY(14px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.hero-fade{
  animation:heroFade .6s cubic-bezier(.22,.61,.36,1) both;
}

.hero-fade-delay{
  animation-delay:.08s;
}

.hero-fade-delay-2{
  animation-delay:.16s;
}

.reveal{
  opacity:0;
  transform:translateY(10px);
  transition:opacity .6s cubic-bezier(.22,.61,.36,1), transform .6s cubic-bezier(.22,.61,.36,1);
}

.reveal.is-visible{
  opacity:1;
  transform:translateY(0);
  will-change:auto;
}

.reveal:not(.is-visible){
  will-change:opacity,transform;
}

.page-transition{
  transition:opacity .35s cubic-bezier(.22,.61,.36,1), transform .35s cubic-bezier(.22,.61,.36,1);
}

.page-transition-out{
  opacity:0;
  transform:translateY(10px);
  will-change:opacity,transform;
}

.page-transition-in{
  animation:pageIn .38s cubic-bezier(.22,.61,.36,1) both;
  will-change:opacity,transform;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.scroll-progress-track{
  height:2px;
  background:rgba(255,255,255,.12);
  overflow:hidden;
}

.scroll-progress-fill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#b98a1f,#e2bd55,#f7d774);
  transform-origin:left center;
  will-change:transform;
}

@keyframes scrollPulse{
  0%,100%{
    transform:translateY(0);
    opacity:.85;
  }

  50%{
    transform:translateY(6px);
    opacity:1;
  }
}

.scroll-indicator{
  animation:scrollPulse 2.2s ease-in-out infinite;
}

.scroll-indicator-ring{
  animation:scrollPulse 2.2s ease-in-out infinite;
}

.hover-card{
  transition:transform .38s cubic-bezier(.22,.61,.36,1), border-color .38s ease, box-shadow .38s ease;
}

.hover-card:hover{
  transform:translateY(-4px);
  border-color:rgba(226,189,85,.65) !important;
  box-shadow:0 18px 34px rgba(0,0,0,.28);
  will-change:transform;
}

@media (prefers-reduced-motion: reduce){
  .breathing-bg::before,.logo-star,.logo-glow,.reveal,.scroll-indicator,.scroll-indicator-ring,.page-transition-in,.hero-fade,.parallax-layer{
    animation:none !important;
    transition:none !important;
  }

    opacity:1;

    scroll-behavior:auto;
